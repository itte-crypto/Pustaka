<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cerita dari Kampung Teduh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf3e2;--ink:#3a2a1a;--mute:#8a7560;--card:#fff9ec;--accent:#c96f1a;--line:#e6d6b8;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1812;--ink:#f3e6d0;--mute:#b6a58c;--card:#2a2219;--accent:#f0a24f;--line:#3d3226;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1812;--ink:#f3e6d0;--mute:#b6a58c;--card:#2a2219;--accent:#f0a24f;--line:#3d3226;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Andika,"Segoe UI",system-ui,sans-serif;--fs:1}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,.fr{font-family:Fredoka,Andika,system-ui,sans-serif;font-weight:600}
.view{height:100%}.view[hidden]{display:none!important}
/* rak */
#home{overflow:auto;padding:clamp(18px,4vw,48px);max-width:900px;margin:0 auto}
#home h2{margin:0;font-size:clamp(1.6rem,5vw,2.4rem)}
#home .sub{color:var(--mute);margin:.2em 0 1.6em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.book{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;padding:0;display:block}
.book:hover{transform:translateY(-3px)}
.book img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.book .in{padding:12px 14px 16px}
.book b{font-family:Fredoka,Andika,sans-serif;font-size:1.25rem;display:block}
.book small{color:var(--mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:.75rem;padding:3px 10px;border-radius:99px;background:var(--line);color:var(--ink)}
.chip.a{background:var(--accent);color:var(--on)}
.soon{border:2px dashed var(--line);border-radius:18px;display:grid;place-items:center;color:var(--mute);min-height:150px;text-align:center;padding:16px}
/* pembaca */
#read{display:flex;flex-direction:column}
.bar,.nav{display:flex;align-items:center;gap:8px;padding:8px 12px}
.bar .t{flex:1;font-family:Fredoka,Andika,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px}
.ib{min-width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 10px}
.ib:hover,.ib:focus-visible{border-color:var(--accent)}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.stage{animation:none}}
.pic{flex:0 1 50%;min-height:0;padding:0 12px}
.pic img,.cover img{width:100%;height:100%;object-fit:cover;display:block;border-radius:18px}
.txt{flex:1;overflow:auto;display:flex;flex-direction:column;justify-content:flex-start;gap:1em;text-align:center;padding:14px clamp(16px,4vw,48px)}
.id p,.en p{margin:.35em 0}
.id{font-size:calc(clamp(1.35rem,4.4vw,2.5rem)*var(--fs));line-height:1.35}
.en{font-size:calc(clamp(1rem,3vw,1.6rem)*var(--fs));line-height:1.35;color:var(--mute)}
body:not([data-lang="bi"]) .en{display:none}
.id b,.en b{color:var(--accent);font-family:Fredoka,Andika,sans-serif}
.q .id{color:var(--accent);font-family:Fredoka,Andika,sans-serif}
.cover{position:relative;flex:1;min-height:0;padding:0 12px}
.cover img{object-position:68% 50%}
.ct{position:absolute;inset:0 12px;border-radius:18px;display:flex;flex-direction:column;align-items:center;padding:7% 16px 0;text-align:center;color:#fff;background:linear-gradient(rgba(20,12,4,.55),transparent 55%);text-shadow:0 2px 8px rgba(0,0,0,.5)}
.ct h1{margin:0;font-size:clamp(2.4rem,9vw,4.6rem);line-height:1}
.ct p{margin:.3em 0 .8em;font-size:clamp(1.1rem,3.4vw,1.8rem)}
.ct .chips{justify-content:center;margin:0 0 1.2em}
.ct .chip{text-shadow:none}
.go{border:0;background:var(--accent);color:var(--on);padding:12px 26px;border-radius:99px;font-size:1.1rem;margin:4px;text-shadow:none}
.go.o{background:rgba(255,255,255,.9);color:#3a2a1a}
.nav{padding-bottom:12px}
.nav .ib{min-width:56px;height:52px;font-size:1.6rem}
.nav .ib:disabled{opacity:.35;cursor:default}
.prog{flex:1;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
#pn{min-width:4.5em;text-align:center;color:var(--mute);font-size:.9rem}
@media (min-aspect-ratio:1/1) and (min-width:700px){
 .stage{flex-direction:row}
 .pic{flex:0 0 46%;padding:0 6px 0 12px}
 .txt{flex:1;padding:20px 40px}
}
.ch{font-family:Fredoka,Andika,sans-serif;color:var(--accent);font-size:calc(clamp(1rem,3vw,1.5rem)*var(--fs));line-height:1.25}
.ch small{display:block;color:var(--mute);font-size:.8em;font-weight:500}
body:not([data-lang="bi"]) .ch small{display:none}
.dense .id{font-size:calc(clamp(1.1rem,3.3vw,1.85rem)*var(--fs))}
.dense .en{font-size:calc(clamp(.95rem,2.6vw,1.35rem)*var(--fs))}
.dense2 .id{font-size:calc(clamp(1rem,2.5vw,1.4rem)*var(--fs))}
.dense2 .en{font-size:calc(clamp(.88rem,2vw,1.15rem)*var(--fs))}
.dense2 .ch{font-size:calc(clamp(.95rem,2.4vw,1.25rem)*var(--fs))}
.txt.more::after{content:'↓ gulir untuk lanjut';position:sticky;bottom:0;align-self:center;margin-top:auto;font-size:.8rem;font-family:Andika,system-ui,sans-serif;background:var(--accent);color:var(--on);padding:3px 14px;border-radius:99px;opacity:.9;pointer-events:none}
.txt>:first-child{margin-top:auto}.txt>:last-child{margin-bottom:auto}
@media (max-width:699px){.pic{flex-basis:54%}.dense .pic{flex-basis:46%}}
@media (max-width:520px){.bar .t{display:none}.tools{margin-left:auto}}
#teach{display:flex;flex-direction:column}
.tab{font-size:.85rem}.tab.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.doc{flex:1;overflow:auto;padding:8px clamp(16px,4vw,40px) 40px;width:100%;max-width:780px;margin:0 auto;line-height:1.6}
.doc h1{font-size:clamp(1.6rem,5vw,2.2rem);margin:.4em 0 .1em}
.doc h2{font-size:1.25rem;margin:1.6em 0 .4em;color:var(--accent)}
.doc ul{padding-left:1.2em}.doc li{margin:.35em 0}.doc li p,.doc p{margin:.4em 0}.doc li ul{margin:.2em 0}
.doc em{color:var(--mute)}
.doc a.pg{color:var(--accent);font-weight:700;text-decoration:underline;cursor:pointer}
.pic{position:relative}
.pic img{object-fit:contain;background:var(--line);cursor:zoom-in}
.pic::after{content:'⤢';position:absolute;right:22px;bottom:10px;width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;pointer-events:none}
.go.o{border:1px solid var(--line)}
@media (max-aspect-ratio:1/1),(max-width:699px){
 .cover{display:flex;flex-direction:column;align-items:center;overflow:auto}
 .cover img{height:auto;max-height:50vh;flex:0 0 auto;object-fit:contain}
 .ct{position:static;background:none;color:var(--ink);text-shadow:none;padding:18px 12px 8px;flex:1;justify-content:center}
}
#zoom{position:fixed;inset:0;z-index:20;background:rgba(15,10,5,.92);display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
#zoom[hidden]{display:none}
#zoom img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
.ph{width:100%;height:100%;border-radius:18px;background:linear-gradient(135deg,var(--line),var(--card));display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mute);text-align:center}
.ph b{font:600 clamp(2.5rem,12vw,5rem)/1 Fredoka,Andika,sans-serif;color:var(--accent);opacity:.6}
.ph small{margin-top:6px}
.ph .il{display:block;margin:10px 16px 0;font-size:.78rem;line-height:1.35}
.pic:has(.ph)::after{display:none}
.cover .ph{background:linear-gradient(135deg,#7a4b1e,#c96f1a)}
@media (max-aspect-ratio:1/1),(max-width:699px){.cover .ph{height:30vh}}
.en:empty{display:none}
.tools2{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
#q{flex:1;min-width:200px;font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.seg{display:flex;gap:4px}.seg button,.fb{font:inherit;font-size:.85rem;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.seg button.on,.fb.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.fb:disabled{opacity:.4;cursor:default}.fb small{opacity:.75}
.fl{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.grp{font-family:Fredoka,Andika,sans-serif;font-size:1.3rem;margin:1.8em 0 .6em}.grp small{color:var(--mute);font-family:Andika,sans-serif;font-size:.7em;font-weight:400}
body:not([data-lang="id"]) .txt.more::after{content:'\2193  scroll for more'}
/* gambar A4: portrait untuk halaman, landscape untuk sampul */
.pic{flex:0 0 auto;height:100%;aspect-ratio:1/1.4142;max-width:58%;box-sizing:border-box;padding:0 0 0 12px}
.pic img{object-fit:contain;background:transparent}
.cover:has(img){display:flex;flex-direction:column;align-items:center;gap:10px;overflow:hidden}
.cover:has(img) img{flex:1 1 0;min-height:0;width:auto;max-width:100%;max-height:none;height:auto;object-fit:contain}
.cover:has(img) .ct{position:static;inset:auto;background:none;color:var(--ink);text-shadow:none;padding:0 0 8px;flex:0 0 auto;flex-direction:row;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center}
.cover:has(img) .ct .chips{margin:0}
.cover:not(.end):has(img) .ct h1,.cover:not(.end):has(img) .ct p{display:none}
.cover.end:has(img) .ct h1{font-size:clamp(1.6rem,4vw,2.4rem)}
.cover.end:has(img) .ct p{margin:0}
.book img{aspect-ratio:1.4142/1}
@media (max-aspect-ratio:1/1),(max-width:699px){.pic{height:auto;aspect-ratio:auto;max-width:none;flex:0 1 46%;padding:0 12px}}
</style>
</head>
<body data-lang="en">

<main id="home" class="view">
 <button class="ib" id="hLang" aria-label="Language" style="float:right"></button>
 <h2>Cerita dari Kampung Teduh</h2>
 <p class="sub">Stories from Kampung Teduh</p>
 <div class="tools2"><input id="q" type="search" aria-label="Search"><div class="seg" id="by"><button data-b="fase"></button><button data-b="lp"></button></div></div>
 <div class="fl" id="fF"></div><div class="fl" id="fL"></div>
 <div id="shelf"></div>
 <p class="sub" id="upd" style="font-size:.8rem;margin-top:1.6em"></p>
</main>

<section id="read" class="view" hidden>
 <header class="bar">
  <button class="ib" id="bHome" aria-label="Kembali ke rak buku">⌂</button>
  <span class="t">Bekal Bima</span>
  <div class="tools">
   <button class="ib tab" id="bTeach" aria-label="Panduan guru">Guru</button>
   <button class="ib" id="bLang" aria-label="Ganti bahasa"></button>
   <button class="ib" id="bMinus" aria-label="Perkecil huruf">A−</button>
   <button class="ib" id="bPlus" aria-label="Perbesar huruf">A+</button>
   <button class="ib" id="bFull" aria-label="Layar penuh">⛶</button>
  </div>
 </header>
 <div class="stage" id="stage"></div>
 <footer class="nav">
  <button class="ib" id="bPrev" aria-label="Halaman sebelumnya">‹</button>
  <div class="prog"><i id="pf"></i></div><span id="pn"></span>
  <button class="ib" id="bNext" aria-label="Halaman berikutnya">›</button>
 </footer>
</section>

<section id="teach" class="view" hidden>
 <header class="bar">
  <button class="ib" id="tBack" aria-label="Kembali ke buku">‹</button>
  <span class="t">Panduan guru</span>
  <div class="tools"><button class="ib tab" id="tKg">Kartu Guru</button><button class="ib tab" id="tKn">Kartu Nilai</button></div>
 </header>
 <article class="doc" id="doc"></article>
</section>

<div id="zoom" hidden role="dialog" aria-label="Gambar penuh"><img alt=""></div>
<script>
let BOOKS=[],KNS={};
const $=s=>document.querySelector(s);
let B={pages:[],slug:''},N=0;
let cur=0,last=0,fs=1,lang='en',lp=null;
try{fs=parseFloat(localStorage.getItem('kt-fs'))||1;lp=localStorage.getItem('kt-lang3');if(lp)lang=lp}catch(e){}
const save=()=>{try{localStorage.setItem('kt-fs',fs)}catch(e){}};
function prefs(){document.body.style.setProperty('--fs',fs);setTimeout(()=>{const x=$('.txt');if(x)x.dispatchEvent(new Event('scroll'))},0);document.body.dataset.lang=lang;$('#bLang').textContent=({en:'EN',bi:'EN + ID',id:'ID'})[lang]}
const go=n=>{location.hash='baca-'+B.slug+'-'+Math.max(0,Math.min(N+1,n))};
function render(){
 const s=$('#stage'),im=B.imgs,ps=' style="object-position:'+B.pos+'"';let h='';const cv=a=>im.cover?'<img src="'+im.cover+'"'+ps+' alt="'+(a?'Sampul '+B.title:'')+'" onerror="imgFail(this)">':'<div class="ph"></div>';
 if(cur===0)h='<div class="cover">'+cv(1)+'<div class="ct"><h1>'+tt(B)[0]+'</h1><p>'+tt(B)[1]+'</p>'+chips(B)+'<button class="go" id="start">'+U('start')+'</button></div></div>';
 else if(cur>N)h='<div class="cover end">'+cv(0)+'<div class="ct"><h1>'+U('end')+'</h1><p>'+(lang==='bi'?'Tamat':'')+'</p><div><button class="go" id="again">'+U('again')+'</button><button class="go o" id="back">'+U('shelf')+'</button></div></div></div>';
 else{const p=B.pages[cur-1],m0=lang==='id'?'id':'en',m=p[m0].length?m0:(m0==='id'?'en':'id'),o=m==='id'?'en':'id';h=(im['s'+cur]?'<div class="pic"><img src="'+im['s'+cur]+'" alt="Ilustrasi halaman '+cur+'" data-pg="1" onerror="imgFail(this)"></div>':'<div class="pic"><div class="ph"><b>'+cur+'</b><small>'+U('soon')+'</small>'+(p.ill?'<em class="il">'+p.ill+'</em>':'')+'</div></div>')+'<div class="txt'+(p.q?' q':'')+'">'+(p.ch?chh(p.ch):'')+'<div class="id" lang="'+m+'">'+p[m].map(x=>'<p>'+x+'</p>').join('')+'</div>'+(lang==='bi'&&p[o].length?'<div class="en" lang="'+o+'">'+p[o].map(x=>'<p>'+x+'</p>').join('')+'</div>':'')+'</div>'}
 s.style.animation='none';s.offsetHeight;s.style.animation='';
 s.innerHTML=h;
 if(cur===0&&!warmed[B.slug]){warmed[B.slug]=1;B.pages.forEach((p,i)=>{const u=B.imgs['s'+(i+1)];if(u)fetch(u).catch(()=>{})})}
 const pi=$('.pic img');if(pi)pi.onclick=()=>{$('#zoom img').src=pi.src;$('#zoom').hidden=false};
 const tx=$('.txt');if(tx){const f=()=>tx.classList.toggle('more',tx.scrollHeight>tx.clientHeight+6&&tx.scrollTop+tx.clientHeight<tx.scrollHeight-6);tx.onscroll=f;requestAnimationFrame(f)}
 $('#pf').style.width=(cur/(N+1)*100)+'%';
 $('#pn').textContent=cur===0?U('cover'):cur>N?U('end'):cur+' / '+N;
 $('#bPrev').disabled=cur===0;$('#bNext').disabled=cur>N;
 const a=$('#start'),b=$('#again'),c=$('#back');
 if(a)a.onclick=()=>go(1);if(b)b.onclick=()=>go(0);if(c)c.onclick=()=>{location.hash='rak'};
}
function tp(t){const m=/^(Halaman|Bab) (\d+)(?:-\d+)?:$/.exec(t);
 if(m)return m[1]==='Halaman'?+m[2]:B.pages.findIndex(p=>p.ch&&(p.ch[0].startsWith('Bab '+m[2]+' ')||p.ch[0].startsWith('Chapter '+m[2]+' ')))+1;
 if(t==='Akhir:')return B.pages[N-1].q?N-1:N;return 0}
function teach(n){
 const d=$('#doc');d.innerHTML=n?(KNS[B.attr]?md(KNS[B.attr]):'<p>Kartu Nilai belum tersedia.</p>'):(B.kg?md(B.kg):'<p>Kartu Guru belum tersedia.</p>');d.scrollTop=0;
 $('#tKg').classList.toggle('on',!n);$('#tKn').classList.toggle('on',!!n);
 d.querySelectorAll('strong').forEach(s=>{const p=tp(s.textContent);if(p>0)s.outerHTML='<a class="pg" role="link" tabindex="0" data-p="'+p+'">'+s.textContent+'</a>'});
 d.querySelectorAll('a.pg').forEach(a=>{const f=()=>go(+a.dataset.p);a.onclick=f;a.onkeydown=e=>{if(e.key==='Enter')f()}});
}
function route(){
 $('#zoom').hidden=true;
 const h=location.hash.slice(1);let m,r=0,g=0,n=0,k=0,b=null;
 if(m=/^baca-([a-z0-9]+)-(\d+)$/.exec(h)){r=1;b=m[1];n=+m[2]}
 else if(m=/^guru-nilai-([a-z0-9]+)$/.exec(h)){g=1;k=1;b=m[1]}
 else if(m=/^guru-([a-z0-9]+)$/.exec(h)){g=1;b=m[1]}
 b=BOOKS.find(x=>x.slug===b);
 if(!b)r=g=0;else{B=b;N=b.pages.length;document.body.classList.toggle('dense',!!b.dense);document.body.classList.toggle('dense2',b.dense===2)}
 if(!lp){const L0=(r||g)?(B.lang0||'en'):'en';if(L0!==lang){lang=L0;prefs();ui();if(!(r||g)&&BOOKS.length)shelf()}}
 $('#read').hidden=!r;$('#teach').hidden=!g;$('#home').hidden=!!(r||g);
 if(r){cur=Math.max(0,Math.min(N+1,n));last=cur;$('#read .t').innerHTML=tt(B)[0];render()}
 else if(g)teach(k);
}
$('#bTeach').onclick=()=>{location.hash='guru-'+B.slug};
$('#tBack').onclick=()=>go(last);
$('#tKg').onclick=()=>{location.hash='guru-'+B.slug};$('#tKn').onclick=()=>{location.hash='guru-nilai-'+B.slug};
$('#bHome').onclick=()=>{location.hash='rak'};
$('#bPrev').onclick=()=>go(cur-1);$('#bNext').onclick=()=>go(cur+1);
$('#bLang').onclick=()=>{lang=lp=NX[lang];try{localStorage.setItem('kt-lang3',lang)}catch(e){}prefs();save();ui();shelf();if(!$('#read').hidden)render()};
$('#bMinus').onclick=()=>{fs=Math.max(.7,fs-.15);prefs();save()};
$('#bPlus').onclick=()=>{fs=Math.min(1.8,fs+.15);prefs();save()};
$('#bFull').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
document.addEventListener('keydown',e=>{
 if(!$('#zoom').hidden){if(e.key==='Escape'||e.key==='Enter'||e.key===' ')$('#zoom').hidden=true;return}
 if($('#read').hidden)return;
 if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();if(cur<=N)go(cur+1)}
 else if(e.key==='ArrowLeft'){if(cur>0)go(cur-1)}
 else if(e.key==='Escape'&&!document.fullscreenElement)location.hash='rak';
});
let x0=null;
$('#stage').addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
$('#stage').addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;x0=null;
 if(d<-60&&cur<=N)go(cur+1);else if(d>60&&cur>0)go(cur-1)},{passive:true});
addEventListener('hashchange',route);
$('#zoom').onclick=()=>{$('#zoom').hidden=true};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const inl=(s,a='b',c='i')=>esc(s).replace(/\*\*(.+?)\*\*/g,'<'+a+'>$1</'+a+'>').replace(/\*(.+?)\*/g,'<'+c+'>$1</'+c+'>');
function md(s){const L=s.replace(/\\([\\`*_{}\[\]()#+\-.!"'<>|~])/g,'$1').split('\n');let h='',st=[],p=[];
 const fp=()=>{if(p.length){h+='<p>'+inl(p.join(' '),'strong','em')+'</p>';p=[]}};
 const cl=()=>{while(st.length){h+='</li></ul>';st.pop()}};
 for(const raw of L){const m=/^(\s*)[-*]\s+(.*)$/.exec(raw),t=raw.trim();
  if(m){fp();const n=m[1].length;
   if(!st.length||n>st[st.length-1]){h+='<ul>';st.push(n)}
   else{while(st.length>1&&n<st[st.length-1]){h+='</li></ul>';st.pop()}h+='</li>'}
   h+='<li>'+inl(m[2],'strong','em');continue}
  if(!t){fp();continue}
  const d=/^(#{1,3})\s+(.*)$/.exec(t);fp();cl();
  if(d)h+='<h'+d[1].length+'>'+inl(d[2],'strong','em')+'</h'+d[1].length+'>';else p.push(t)}
 fp();cl();return h}
function imgFail(i){const d=document.createElement('div');d.className='ph';
 if(i.closest('.book'))d.style.cssText='aspect-ratio:1.4142/1;height:auto';
 else if(i.dataset.pg){const p=B.pages[cur-1]||{};d.innerHTML='<b>'+cur+'</b><small>'+U('soon')+'</small>'+(p.ill?'<em class="il">'+p.ill+'</em>':'')}
 i.replaceWith(d)}
const prep=b=>{const im={cover:'img/'+b.slug+'/cover.webp'};b.pages.forEach((p,i)=>im['s'+(i+1)]='img/'+b.slug+'/s'+(i+1)+'.webp');
 return {...b,_s:(b.title+' '+(b.en||'')+' '+b.attr+' '+b.pages.map(p=>(p.id||[]).concat(p.en||[]).join(' ')).join(' ')).toLowerCase().replace(/\*/g,''),title:esc(b.title),en:esc(b.en||''),imgs:im,pages:b.pages.map(p=>({...p,ill:p.ill?esc(p.ill):'',ch:p.ch&&[esc(p.ch[0]),p.ch[1]?esc(p.ch[1]):''],id:(p.id||[]).map(x=>inl(x)),en:(p.en||[]).map(x=>inl(x))}))}};

const NX={en:'bi',bi:'id',id:'en'},warmed={};

 $('#by [data-b=fase]').textContent=U('byP');$('#by [data-b=lp]').textContent=U('byL');
 $('#bTeach').textContent=U('teacher');$('#hLang').textContent=$('#bLang').textContent}
function shelf(){
 const q=F.q.trim().toLowerCase(),byF=F.by==='fase',have=new Set(BOOKS.map(b=>b.attr)),li=b=>LP.indexOf(b.attr);
 $('#fF').innerHTML='<button class="fb'+(F.fase?'':' on')+'" data-f="0">'+U('all')+'</button>'+[1,2,3,4].map(n=>'<button class="fb'+(F.fase===n?' on':'')+'" data-f="'+n+'">'+PH(n)+' <small>'+GR[n]+'</small></button>').join('');
 $('#fL').innerHTML='<button class="fb'+(F.lp?'':' on')+'" data-l="">'+U('all')+'</button>'+LP.map(a=>'<button class="fb'+(F.lp===a?' on':'')+'" data-l="'+a+'"'+(have.has(a)||F.lp===a?'':' disabled')+'>'+a+'</button>').join('');
 document.querySelectorAll('#by button').forEach(x=>x.classList.toggle('on',x.dataset.b===F.by));
 const L=BOOKS.filter(b=>(!F.fase||b.fase===F.fase)&&(!F.lp||b.attr===F.lp)&&(!q||b._s.includes(q)))
  .sort(byF?(a,b)=>a.fase-b.fase||li(a)-li(b):(a,b)=>li(a)-li(b)||a.fase-b.fase);
 let h='',k0=null;
 L.forEach(b=>{const k=byF?b.fase:b.attr,t=tt(b);
  if(k!==k0){if(k0!==null)h+='</div>';h+='<h3 class="grp">'+(byF?PH(k)+' <small>'+GR[k]+'</small>':k)+'</h3><div class="grid">';k0=k}
  h+='<button class="book" data-s="'+b.slug+'"><img src="'+b.imgs.cover+'" alt="'+t[0]+'" onerror="imgFail(this)"><div class="in"><b>'+t[0]+'</b><small>'+t[1]+'</small>'+chips(b).replace('</div>','<span class="chip">'+b.pages.length+' '+U('pages')+'</span></div>')+'</div></button>'});
 if(k0!==null)h+='</div>';
 $('#shelf').innerHTML=h||'<p class="sub">'+U('none')+'</p>'}
$('#fF').onclick=e=>{const b=e.target.closest('[data-f]');if(b){F.fase=+b.dataset.f;shelf()}};

fetch('data.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{try{localStorage.setItem('kt-data',JSON.stringify(d))}catch(e){}load(d)})
 .catch(()=>{try{load(JSON.parse(localStorage.getItem('kt-data')))}catch(e){$('#shelf').textContent='Data belum bisa dimuat. Periksa koneksi internet.'}});
